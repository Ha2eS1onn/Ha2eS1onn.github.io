<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的微信</title>
    <link rel="icon" type="image/x-icon" href="https://kasho.fun/favicon.png">
    <style>
        /* ==================== 主题配色 ==================== */
        :root {
            --bg-gradient-start: #eff6ff;
            --bg-gradient-mid: #f8fafc;
            --bg-gradient-end: #dbeafe;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.9);
            --text-primary: #1e3a8a;
            --text-secondary: #3b82f6;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-light: #60a5fa;
            --shadow: rgba(59, 130, 246, 0.12);
            --grid-color: rgba(59, 130, 246, 0.06);
            --bullet-color: #93c5fd;
            --link-color: #2563eb;
        }

        [data-theme="dark"] {
            --bg-gradient-start: #020617;
            --bg-gradient-mid: #0f172a;
            --bg-gradient-end: #1e293b;
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(96, 165, 250, 0.18);
            --text-primary: #bfdbfe;
            --text-secondary: #93c5fd;
            --text-muted: #64748b;
            --accent: #60a5fa;
            --accent-light: #93c5fd;
            --shadow: rgba(0, 0, 0, 0.4);
            --grid-color: rgba(96, 165, 250, 0.1);
            --bullet-color: #3b82f6;
            --link-color: #60a5fa;
        }

        /* ==================== 基础重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
            background-attachment: fixed;
            color: var(--text-primary);
            transition: background 0.5s ease, color 0.3s ease;
            overflow-x: hidden;
            position: relative;
        }

        /* 网格底纹 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            transition: background-image 0.5s ease;
        }

        /* Canvas 背景层 */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ==================== 主题切换按钮 ==================== */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 0 24px var(--shadow);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ==================== 主卡片 ==================== */
        .card-container {
            position: relative;
            z-index: 1;
            width: 92%;
            max-width: 860px;
            animation: fadeInUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 48px 56px;
            display: flex;
            gap: 56px;
            box-shadow:
                0 8px 40px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* ==================== 左栏：文字资料 ==================== */
        .left-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.3;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .account-row {
            font-size: 15px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .account-row .label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .account-row .value {
            font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
            background: rgba(59, 130, 246, 0.08);
            padding: 2px 10px;
            border-radius: 6px;
            color: var(--accent);
            font-size: 14px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        [data-theme="dark"] .account-row .value {
            background: rgba(96, 165, 250, 0.12);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--bullet-color), transparent);
            opacity: 0.4;
            margin: 4px 0;
        }

        .bullet-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 4px 0;
        }

        .bullet-list li {
            position: relative;
            padding-left: 18px;
            font-size: 14.5px;
            line-height: 1.7;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .bullet-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--bullet-color);
            transition: background 0.3s ease;
        }

        .bullet-list li strong,
        .bullet-list li .highlight {
            color: var(--accent-light);
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-link {
            margin-top: 8px;
            font-size: 14px;
            color: var(--link-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            position: relative;
        }

        .footer-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--link-color);
            transition: width 0.3s ease;
        }

        .footer-link:hover::after {
            width: 100%;
        }

        .footer-link:hover {
            opacity: 0.85;
        }

        /* ==================== 右栏：二维码 ==================== */
        .right-col {
            flex: 0 0 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .qr-wrapper {
            position: relative;
            padding: 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            border: 1px solid var(--card-border);
            transition: all 0.5s ease;
        }

        [data-theme="dark"] .qr-wrapper {
            background: rgba(30, 41, 59, 0.5);
        }

        .qr-code {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            display: block;
            object-fit: cover;
            background: #fff;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .qr-code:hover {
            transform: scale(1.03);
        }

        .qr-hint {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
            transition: color 0.3s ease;
        }

        .platform-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(59, 130, 246, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .platform-tag {
            background: rgba(96, 165, 250, 0.12);
        }

        .platform-tag svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* ==================== 动画 ==================== */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== 响应式 ==================== */
        @media (max-width: 768px) {
            .card {
                flex-direction: column;
                padding: 36px 28px;
                gap: 36px;
            }

            .right-col {
                flex: 1;
                width: 100%;
            }

            .title {
                font-size: 24px;
            }

            .qr-code {
                width: 160px;
                height: 160px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
                border-radius: 22px;
            }

            .title {
                font-size: 22px;
            }

            .bullet-list li {
                font-size: 13.5px;
            }
        }
    </style>
</head>
<body>

    <!-- 主题切换 -->
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="icon-sun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <!-- 粒子背景 -->
    <canvas id="bg-canvas"></canvas>

    <!-- 主卡片 -->
    <div class="card-container">
        <div class="card">
            <div class="left-col">
                <h1 class="title" id="pageTitle">加载中...</h1>
                <div class="account-row" id="accountRow">
                    <span class="label" id="accountLabel">账号</span>
                    <span class="value" id="accountValue">---</span>
                </div>
                <div class="divider"></div>
                <ul class="bullet-list" id="bulletList">
                    <!-- 由 JS 填充 -->
                </ul>
                <a class="footer-link" id="footerLink" href="#" target="_blank" rel="noopener">
                    <span id="footerText">链接</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                </a>
            </div>

            <div class="right-col">
                <div class="qr-wrapper">
                    <img 
                        src="YOUR_QR_CODE_URL_HERE" 
                        alt="二维码" 
                        class="qr-code"
                        id="qrImage"
                    >
                </div>
                <p class="qr-hint" id="qrHint">扫一扫二维码，加入群聊</p>
                <div class="platform-tag" id="platformTag">
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    <span id="platformName">QQ</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==================== 配置区：请修改以下内容 ==================== */
        const CONFIG = {
            title: "桦凇の个人微信",
            accountLabel: "微信号",
            accountValue: "ly114514_1919810",
            bullets: [
                "欢迎来找我聊天喵~",
                "请备注来意喵~",
                "广告位招租喵~",
            ],
            footerText: "返回",
            footerUrl: "https://kasho.fun",
            qrCodeUrl: "/Wechat.png",
            qrHint: "这是二维码",
            platformName: "微信"
        };
        /* ================================================================ */


        /* ==================== 填充内容 ==================== */
        document.getElementById('pageTitle').textContent = CONFIG.title;
        document.getElementById('accountLabel').textContent = CONFIG.accountLabel;
        document.getElementById('accountValue').textContent = CONFIG.accountValue;
        document.getElementById('footerText').textContent = CONFIG.footerText;
        document.getElementById('footerLink').href = CONFIG.footerUrl;
        document.getElementById('qrImage').src = CONFIG.qrCodeUrl;
        document.getElementById('qrHint').textContent = CONFIG.qrHint;
        document.getElementById('platformName').textContent = CONFIG.platformName;

        const bulletList = document.getElementById('bulletList');
        CONFIG.bullets.forEach(text => {
            const li = document.createElement('li');
            li.innerHTML = text;
            bulletList.appendChild(li);
        });


        /* ==================== 主题切换 ==================== */
        const themeToggle = document.getElementById('themeToggle');
        const iconMoon = document.getElementById('icon-moon');
        const iconSun = document.getElementById('icon-sun');
        const root = document.documentElement;

        function setTheme(theme) {
            if (theme === 'dark') {
                root.setAttribute('data-theme', 'dark');
                iconMoon.style.display = 'none';
                iconSun.style.display = 'block';
            } else {
                root.removeAttribute('data-theme');
                iconMoon.style.display = 'block';
                iconSun.style.display = 'none';
            }
            localStorage.setItem('theme', theme);
        }

        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme) {
            setTheme(savedTheme);
        } else if (prefersDark) {
            setTheme('dark');
        }

        themeToggle.addEventListener('click', () => {
            const current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            setTheme(current === 'dark' ? 'light' : 'dark');
        });


        /* ==================== Canvas 粒子背景（已修复） ==================== */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 60;
        const CONNECT_DIST = 130;
        const MOUSE_DIST = 160;
        const MOUSE_FORCE = 0.08;
        const DAMPING = 0.96;
        const MAX_SPEED = 1.2;
        const BASE_SPEED = 0.4;
        let mouse = { x: null, y: null };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * BASE_SPEED;
                this.vy = Math.sin(angle) * BASE_SPEED;
                this.size = Math.random() * 2 + 0.8;
                this.baseVx = this.vx;
                this.baseVy = this.vy;
            }

            update() {
                // 鼠标吸引（柔和的力）
                if (mouse.x != null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MOUSE_DIST && dist > 1) {
                        const force = (1 - dist / MOUSE_DIST) * MOUSE_FORCE;
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                }

                // 阻尼衰减：让粒子自然慢下来，避免能量累积
                this.vx *= DAMPING;
                this.vy *= DAMPING;

                // 恢复基础漂移：给粒子一个微弱的回归力，保持长期运动
                this.vx += (this.baseVx - this.vx) * 0.015;
                this.vy += (this.baseVy - this.vy) * 0.015;

                // 软速度限制：只限制上限，不强制归一化
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > MAX_SPEED) {
                    const scale = MAX_SPEED / speed;
                    this.vx *= scale;
                    this.vy *= scale;
                }

                // 位置更新
                this.x += this.vx;
                this.y += this.vy;

                // 软边界：碰到边缘时平滑反弹，而不是生硬反转
                const margin = 20;
                if (this.x < margin) {
                    this.vx += 0.03;
                    this.baseVx = Math.abs(this.baseVx);
                }
                if (this.x > canvas.width - margin) {
                    this.vx -= 0.03;
                    this.baseVx = -Math.abs(this.baseVx);
                }
                if (this.y < margin) {
                    this.vy += 0.03;
                    this.baseVy = Math.abs(this.baseVy);
                }
                if (this.y > canvas.height - margin) {
                    this.vy -= 0.03;
                    this.baseVy = -Math.abs(this.baseVy);
                }
            }

            draw() {
                const isDark = root.getAttribute('data-theme') === 'dark';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = isDark ? 'rgba(96, 165, 250, 0.5)' : 'rgba(59, 130, 246, 0.4)';
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }

        function drawLines() {
            const isDark = root.getAttribute('data-theme') === 'dark';
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECT_DIST) {
                        ctx.beginPath();
                        const opacity = 1 - dist / CONNECT_DIST;
                        ctx.strokeStyle = isDark
                            ? `rgba(96, 165, 250, ${opacity * 0.2})`
                            : `rgba(59, 130, 246, ${opacity * 0.15})`;
                        ctx.lineWidth = opacity * 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            drawLines();
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });
    </script>
</body>
</html>
